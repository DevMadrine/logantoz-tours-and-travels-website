# Netlify build settings for the Talmar Express site.
# The site is fully prerendered, so Netlify only serves static files.
[build]
  command = "pnpm build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  # Belt and braces with the preset pinned in vite.config.ts: never let Nitro pick the Netlify preset.
  NITRO_PRESET = "node-server"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_build/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
